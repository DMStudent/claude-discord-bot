[project]
name = "claude-discord-bot"
version = "0.1.0"
description = "通过 Discord 使用完整 Claude Code 能力的 Bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
    "python-dotenv>=1.0.0",
    "claude-agent-sdk>=0.1.70",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"
